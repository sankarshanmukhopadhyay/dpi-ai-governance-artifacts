profile_id: CAP-AUTHORITY-BOUNDED-DELEGATION-1
profile_version: 1.0.0
capability_id: CAP-AUTHORITY-BOUNDED-DELEGATION
status: experimental
authority:
  normative: false
  statement: >-
    This profile defines reusable technical assurance requirements only.
    Deployment and institutional authorities retain authority to authorize,
    delegate, revoke, approve, or reject real-world actions.
requirements:
  - id: ABD-001
    mandatory: true
    proposition: Every consequential action identifies an accountable authority and bounded delegation.
  - id: ABD-002
    mandatory: true
    proposition: Delegation is checked for actor, action, resource, purpose, time, and revocation state before effect.
  - id: ABD-003
    mandatory: true
    proposition: Revoked, suspended, expired, not-yet-valid, and out-of-scope requests fail closed.
  - id: ABD-004
    mandatory: true
    proposition: Runtime authorization evidence is recorded before effect and correlated to the resulting effect.
required_evidence:
  - authority_map
  - delegation_record
  - runtime_authorization_record
  - effect_authorization_correlation
  - negative_test_results
negative_cases:
  - out_of_action_scope
  - out_of_purpose_scope
  - revoked_delegation
  - expired_delegation
continuity:
  rules:
    - event_type: authority_revoked
      effect: invalidates
      proposition: Revocation of the accountable authority invalidates present reliance on the assessment.
    - event_type: delegation_revoked
      effect: invalidates
      proposition: Revocation of the assessed delegation invalidates present reliance on the assessment.
    - event_type: delegation_scope_changed
      effect: reassessment_required
      proposition: A change to actor, action, resource, purpose, time, or delegation scope requires reassessment.
    - event_type: policy_rule_changed
      effect: reassessment_required
      proposition: A material change to the governing authorization policy or rule requires reassessment.
    - event_type: implementation_changed
      effect: reassessment_required
      proposition: A material change to the enforcement implementation requires reassessment.
    - event_type: required_evidence_contradicted
      effect: invalidates
      proposition: Evidence that contradicts a mandatory requirement invalidates present reliance on the assessment.
    - event_type: profile_contract_changed
      effect: reassessment_required
      proposition: A material change to the conformance profile requires reassessment against the new contract.
